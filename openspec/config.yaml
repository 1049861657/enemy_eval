schema: spec-driven

context: |
  语言：中文
  所有制品必须用 中文 编写。
  OpenSpec 结构标题与 SHALL/MUST 关键字保持英文。

# 按产出物的规则（可选）
# 为特定产出物添加自定义规则。
# 示例：
#   rules:
#     proposal:
#       - 提案保持在 500 字以内
#       - 始终说明范围之外的内容
#     tasks:
#       - 将任务拆分为每次不超过 2 小时的工作块

# 按操作的指南（可选）
# 为 apply 和 archive 操作添加咨询性指南。
# 此段落独立于上述的产出物规则。
# 示例：
#   operations:
#     apply:
#       guidance:
#         - 测试摘要保持简洁
#     archive:
#       guidance:
#         - 完成前总结归档结果
