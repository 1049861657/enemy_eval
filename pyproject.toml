[project]
name = "enemy-eval"
version = "0.3.0"
description = "Enemy evaluation template image generator with GUI"
requires-python = ">=3.13"
dependencies = [
    "pillow>=12.3.0",
    "skia-python>=144.0",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "numpy>=2.5.2",
    "pyside6>=6.11.2",
    "pyinstaller>=6.22.2",
    "pyinstaller-hooks-contrib>=2026.7",
    "requests>=2.34.2",
    "beautifulsoup4>=4.15.0",
    "structlog>=26.1.0",
    "platformdirs>=4.11.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyright>=1.1.411",
]
