[project]
name = "enemy-eval"
version = "0.6.1"
description = "Enemy evaluation template image generator with GUI"
requires-python = ">=3.13"
dependencies = [
    "skia-python>=144.0",
    "pydantic>=2.13.5",
    "rich>=15.0.0",
    "pyside6>=6.11.2",
    "structlog>=26.1.0",
    "platformdirs>=4.12.1",
    "pydantic-settings>=2.15.0",
    "httpx[http2]>=0.28.1",
    "httpx-retries>=0.6.0",
    "cachetools>=7.2.0",
]

[project.scripts]
enemy-eval = "gui_main:main"
enemy-eval-cli = "main:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyright>=1.1.414",
]
build = [
    "pyinstaller>=6.22.3",
    "pyinstaller-hooks-contrib>=2026.7",
]

[tool.pyright]
include = ["models", "core", "utils", "gui", "scripts", "tests", "main.py", "gui_main.py"]
exclude = [".venv", "build", "dist", "data", "enemy", "example", "resource", "todos"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
# GUI 目录按 strict 计错，与整体 basic 的基线分开统计。
strict = ["gui"]
